<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tauri + React + Typescript</title>
  <!-- Thème posé avant le premier paint : sans ça, l'app flashe en clair le
       temps que React monte. Doit rester synchrone et aligné sur theme.ts
       (clé de stockage, valeur JSON, défaut « system »). -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem("lueurs_theme");
        var pref = raw ? JSON.parse(raw) : "system";
        if (pref !== "light" && pref !== "dark") pref = "system";
        var theme = pref === "system"
          ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : pref;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (e) { /* localStorage indisponible : on reste en clair */ }
    })();
  </script>
</head>

<body>
<!-- Liquid Glass SVG filter (iOS 26) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="liquid-glass-filter">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3"
                    stitchTiles="stitch" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise"
                         scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
